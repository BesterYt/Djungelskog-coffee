<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Заказать кофе</title>
  <style>
    /* ваш CSS-макет */
    body { font-family: sans-serif; background: #333; color: #fff; }
    .form { background: rgba(255,255,255,0.2); padding: 20px; border-radius: 20px; width: 300px; margin: 50px auto; }
    .form input, .form select, .form button { width: 100%; margin: 10px 0; padding: 10px; border-radius: 10px; border: none; }
    .form button { background: #a33; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <div class="form">
    <h2>Как мне вас называть?</h2>
    <input id="name" placeholder="Введите имя" />

    <h3>Выберите объём</h3>
    <select id="volume">
      <option value="S">S (100мл)</option>
      <option value="M">M (140мл)</option>
      <option value="L">L (150мл)</option>
    </select>

    <h3>Выберите кофе-арт</h3>
    <select id="art">
      <option value="Ёлка">Ёлка</option>
      <option value="Панда">Панда</option>
    </select>

    <button id="orderBtn">Заказать</button>
    <p id="result"></p>
  </div>

  <script>
    document.getElementById('orderBtn').onclick = async () => {
      const name = document.getElementById('name').value.trim();
      const volume = document.getElementById('volume').value;
      const art = document.getElementById('art').value;
      if (!name) return alert('Введите имя');
      const res = await fetch('/', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ name, volume, art })
      });
      const data = await res.json();
      if (data.id) {
        document.getElementById('result').textContent = 'Ваш номер заказа: ' + data.id;
      } else {
        document.getElementById('result').textContent = 'Ошибка';
      }
    };
  </script>
</body>
</html>
