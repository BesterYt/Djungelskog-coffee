<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Заказ кофе</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="main.js"></script>
</head>
<body>
  <header>
    <img src="YOUR_IMAGE_URL" alt="Логотип" style="height:50px; border-radius:16px;">
    <nav>
      <a href="order.html">Заказать</a>
      <a href="status.html">Готовность</a>
      <a href="pay.html">Pay Menu</a>
    </nav>
  </header>
  <main>
    <div id="step-name">
      <h2>Введите ваше имя</h2>
      <input id="name-input" type="text" />
      <button onclick="nextStep('step-volume')">Далее</button>
    </div>

    <div id="step-volume" class="hidden">
      <h2>Выберите объем</h2>
      <button onclick="selectVolume('100мл')">100мл</button>
      <button onclick="selectVolume('140мл')">140мл</button>
      <button onclick="selectVolume('150мл')">150мл</button>
    </div>

    <div id="step-art" class="hidden">
      <h2>Выберите арт</h2>
      <button onclick="selectArt('Ёлка')">Ёлка</button>
      <button onclick="selectArt('Панда')">Панда</button>
      <button onclick="selectArt('Без арта')">Без арта</button>
    </div>

    <div id="step-summary" class="hidden">
      <h2>Спасибо, <span id="sum-name"></span>!</h2>
      <p>Ваш заказ: <span id="sum-volume"></span>, арт: <span id="sum-art"></span></p>
      <p>Номер заказа: <strong id="order-id"></strong></p>
    </div>
  </main>
</body>
</html>
